<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App - React + TailwindCSS</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* Custom animations and styles */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.3s ease-out;
        }

        .note-card {
            transition: all 0.3s ease;
        }

        .note-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.15);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Tag badges */
        .tag-badge {
            transition: all 0.2s ease;
        }

        .tag-badge:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================
        function NotesApp() {
            // State Management
            const [notes, setNotes] = useState([]);
            const [showModal, setShowModal] = useState(false);
            const [editingNote, setEditingNote] = useState(null);
            const [currentView, setCurrentView] = useState('all'); // all, pinned, archived, trash
            const [searchQuery, setSearchQuery] = useState('');
            const [filterTag, setFilterTag] = useState('all');

            // Form State
            const [formData, setFormData] = useState({
                title: '',
                description: '',
                tags: []
            });

            const [tagInput, setTagInput] = useState('');

            // Load notes from localStorage on mount
            useEffect(() => {
                const savedNotes = localStorage.getItem('reactNotesApp');
                if (savedNotes) {
                    setNotes(JSON.parse(savedNotes));
                }
            }, []);

            // Save notes to localStorage whenever they change
            useEffect(() => {
                localStorage.setItem('reactNotesApp', JSON.stringify(notes));
            }, [notes]);

            // ==========================================
            // UTILITY FUNCTIONS
            // ==========================================

            const generateId = () => {
                return Date.now() + Math.random().toString(36).substr(2, 9);
            };

            const getAllTags = () => {
                const tagsSet = new Set();
                notes.forEach(note => {
                    if (!note.isDeleted) {
                        note.tags?.forEach(tag => tagsSet.add(tag));
                    }
                });
                return Array.from(tagsSet);
            };

            // ==========================================
            // CRUD OPERATIONS
            // ==========================================

            const createNote = () => {
                if (!formData.title.trim()) {
                    alert('Please enter a title');
                    return;
                }

                const newNote = {
                    id: generateId(),
                    title: formData.title.trim(),
                    description: formData.description.trim(),
                    tags: formData.tags,
                    isPinned: false,
                    isArchived: false,
                    isDeleted: false,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                };

                setNotes([newNote, ...notes]);
                resetForm();
                setShowModal(false);
            };

            const updateNote = () => {
                if (!formData.title.trim()) {
                    alert('Please enter a title');
                    return;
                }

                setNotes(notes.map(note => 
                    note.id === editingNote.id 
                        ? {
                            ...note,
                            title: formData.title.trim(),
                            description: formData.description.trim(),
                            tags: formData.tags,
                            updatedAt: new Date().toISOString()
                        }
                        : note
                ));

                resetForm();
                setEditingNote(null);
                setShowModal(false);
            };

            const deleteNote = (id) => {
                setNotes(notes.map(note => 
                    note.id === id 
                        ? { ...note, isDeleted: true, isPinned: false, isArchived: false }
                        : note
                ));
            };

            const permanentlyDeleteNote = (id) => {
                if (window.confirm('Permanently delete this note? This cannot be undone.')) {
                    setNotes(notes.filter(note => note.id !== id));
                }
            };

            const restoreNote = (id) => {
                setNotes(notes.map(note => 
                    note.id === id 
                        ? { ...note, isDeleted: false }
                        : note
                ));
            };

            // ==========================================
            // PIN, ARCHIVE OPERATIONS
            // ==========================================

            const togglePin = (id) => {
                setNotes(notes.map(note => 
                    note.id === id 
                        ? { ...note, isPinned: !note.isPinned, isArchived: false }
                        : note
                ));
            };

            const toggleArchive = (id) => {
                setNotes(notes.map(note => 
                    note.id === id 
                        ? { ...note, isArchived: !note.isArchived, isPinned: false }
                        : note
                ));
            };

            // ==========================================
            // FORM HANDLERS
            // ==========================================

            const resetForm = () => {
                setFormData({ title: '', description: '', tags: [] });
                setTagInput('');
            };

            const handleAddTag = (e) => {
                if (e.key === 'Enter' && tagInput.trim()) {
                    e.preventDefault();
                    if (!formData.tags.includes(tagInput.trim())) {
                        setFormData({
                            ...formData,
                            tags: [...formData.tags, tagInput.trim()]
                        });
                    }
                    setTagInput('');
                }
            };

            const removeTag = (tagToRemove) => {
                setFormData({
                    ...formData,
                    tags: formData.tags.filter(tag => tag !== tagToRemove)
                });
            };

            const openEditModal = (note) => {
                setEditingNote(note);
                setFormData({
                    title: note.title,
                    description: note.description,
                    tags: note.tags || []
                });
                setShowModal(true);
            };

            const openCreateModal = () => {
                setEditingNote(null);
                resetForm();
                setShowModal(true);
            };

            // ==========================================
            // FILTERING & SEARCH
            // ==========================================

            const getFilteredNotes = () => {
                let filtered = notes;

                // Filter by view
                switch (currentView) {
                    case 'pinned':
                        filtered = filtered.filter(note => note.isPinned && !note.isDeleted);
                        break;
                    case 'archived':
                        filtered = filtered.filter(note => note.isArchived && !note.isDeleted);
                        break;
                    case 'trash':
                        filtered = filtered.filter(note => note.isDeleted);
                        break;
                    default:
                        filtered = filtered.filter(note => !note.isArchived && !note.isDeleted);
                }

                // Filter by tag
                if (filterTag !== 'all') {
                    filtered = filtered.filter(note => note.tags?.includes(filterTag));
                }

                // Filter by search query
                if (searchQuery.trim()) {
                    const query = searchQuery.toLowerCase();
                    filtered = filtered.filter(note => 
                        note.title.toLowerCase().includes(query) ||
                        note.description.toLowerCase().includes(query)
                    );
                }

                // Sort: Pinned first, then by updated date
                return filtered.sort((a, b) => {
                    if (a.isPinned && !b.isPinned) return -1;
                    if (!a.isPinned && b.isPinned) return 1;
                    return new Date(b.updatedAt) - new Date(a.updatedAt);
                });
            };

            const filteredNotes = getFilteredNotes();

            // ==========================================
            // STATISTICS
            // ==========================================

            const stats = {
                total: notes.filter(n => !n.isDeleted).length,
                pinned: notes.filter(n => n.isPinned).length,
                archived: notes.filter(n => n.isArchived).length,
                trash: notes.filter(n => n.isDeleted).length
            };

            // ==========================================
            // RENDER COMPONENTS
            // ==========================================

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50">

                    {/* Header */}
                    <header className="bg-white shadow-lg sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex items-center justify-between">
                                <div className="flex items-center space-x-3">
                                    <i className="fas fa-sticky-note text-3xl text-indigo-600"></i>
                                    <h1 className="text-3xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
                                        Notes App
                                    </h1>
                                </div>
                                <div className="flex items-center space-x-4">
                                    <div className="hidden sm:flex space-x-2">
                                        <span className="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-sm font-semibold">
                                            <i className="fas fa-file-alt mr-1"></i>
                                            {stats.total}
                                        </span>
                                        <span className="px-3 py-1 bg-yellow-100 text-yellow-700 rounded-full text-sm font-semibold">
                                            <i className="fas fa-thumbtack mr-1"></i>
                                            {stats.pinned}
                                        </span>
                                        <span className="px-3 py-1 bg-green-100 text-green-700 rounded-full text-sm font-semibold">
                                            <i className="fas fa-archive mr-1"></i>
                                            {stats.archived}
                                        </span>
                                        <span className="px-3 py-1 bg-red-100 text-red-700 rounded-full text-sm font-semibold">
                                            <i className="fas fa-trash mr-1"></i>
                                            {stats.trash}
                                        </span>
                                    </div>
                                    <button
                                        onClick={openCreateModal}
                                        className="bg-gradient-to-r from-indigo-600 to-purple-600 text-white px-6 py-2 rounded-lg font-semibold hover:shadow-lg transform hover:scale-105 transition-all duration-200"
                                    >
                                        <i className="fas fa-plus mr-2"></i>
                                        New Note
                                    </button>
                                </div>
                            </div>
                        </div>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="bg-white shadow-sm border-b">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex space-x-1 overflow-x-auto py-2">
                                {[
                                    { id: 'all', label: 'All Notes', icon: 'fa-home', count: stats.total },
                                    { id: 'pinned', label: 'Pinned', icon: 'fa-thumbtack', count: stats.pinned },
                                    { id: 'archived', label: 'Archived', icon: 'fa-archive', count: stats.archived },
                                    { id: 'trash', label: 'Trash', icon: 'fa-trash', count: stats.trash }
                                ].map(view => (
                                    <button
                                        key={view.id}
                                        onClick={() => setCurrentView(view.id)}
                                        className={`px-4 py-2 rounded-lg font-medium transition-all duration-200 whitespace-nowrap ${
                                            currentView === view.id
                                                ? 'bg-indigo-600 text-white shadow-md'
                                                : 'text-gray-600 hover:bg-gray-100'
                                        }`}
                                    >
                                        <i className={`fas ${view.icon} mr-2`}></i>
                                        {view.label}
                                        <span className={`ml-2 px-2 py-0.5 rounded-full text-xs ${
                                            currentView === view.id
                                                ? 'bg-white text-indigo-600'
                                                : 'bg-gray-200 text-gray-700'
                                        }`}>
                                            {view.count}
                                        </span>
                                    </button>
                                ))}
                            </div>
                        </div>
                    </nav>

                    {/* Search and Filter Section */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
                        <div className="bg-white rounded-lg shadow-md p-4 mb-6">
                            <div className="flex flex-col md:flex-row gap-4">
                                {/* Search Bar */}
                                <div className="flex-1 relative">
                                    <i className="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                    <input
                                        type="text"
                                        placeholder="Search notes by title or content..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                    />
                                    {searchQuery && (
                                        <button
                                            onClick={() => setSearchQuery('')}
                                            className="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                                        >
                                            <i className="fas fa-times"></i>
                                        </button>
                                    )}
                                </div>

                                {/* Tag Filter */}
                                <div className="md:w-64">
                                    <div className="relative">
                                        <i className="fas fa-filter absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                                        <select
                                            value={filterTag}
                                            onChange={(e) => setFilterTag(e.target.value)}
                                            className="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent appearance-none cursor-pointer"
                                        >
                                            <option value="all">All Tags</option>
                                            {getAllTags().map(tag => (
                                                <option key={tag} value={tag}>{tag}</option>
                                            ))}
                                        </select>
                                        <i className="fas fa-chevron-down absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Notes Grid */}
                        {filteredNotes.length === 0 ? (
                            <div className="text-center py-20">
                                <i className="fas fa-inbox text-6xl text-gray-300 mb-4"></i>
                                <h3 className="text-2xl font-semibold text-gray-600 mb-2">
                                    {searchQuery || filterTag !== 'all' ? 'No notes found' : 'No notes yet'}
                                </h3>
                                <p className="text-gray-500">
                                    {searchQuery || filterTag !== 'all' 
                                        ? 'Try adjusting your search or filter' 
                                        : 'Create your first note to get started'}
                                </p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {filteredNotes.map(note => (
                                    <NoteCard
                                        key={note.id}
                                        note={note}
                                        onEdit={openEditModal}
                                        onDelete={deleteNote}
                                        onPermanentDelete={permanentlyDeleteNote}
                                        onRestore={restoreNote}
                                        onTogglePin={togglePin}
                                        onToggleArchive={toggleArchive}
                                    />
                                ))}
                            </div>
                        )}
                    </div>

                    {/* Modal */}
                    {showModal && (
                        <NoteModal
                            isEditing={!!editingNote}
                            formData={formData}
                            setFormData={setFormData}
                            tagInput={tagInput}
                            setTagInput={setTagInput}
                            handleAddTag={handleAddTag}
                            removeTag={removeTag}
                            onSave={editingNote ? updateNote : createNote}
                            onClose={() => {
                                setShowModal(false);
                                setEditingNote(null);
                                resetForm();
                            }}
                        />
                    )}
                </div>
            );
        }

        // ==========================================
        // NOTE CARD COMPONENT
        // ==========================================
        function NoteCard({ note, onEdit, onDelete, onPermanentDelete, onRestore, onTogglePin, onToggleArchive }) {
            const formatDate = (dateString) => {
                const date = new Date(dateString);
                return date.toLocaleDateString('en-US', { 
                    month: 'short', 
                    day: 'numeric', 
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            };

            return (
                <div className="note-card bg-white rounded-lg shadow-md p-5 animate-fade-in relative overflow-hidden">
                    {/* Pinned Indicator */}
                    {note.isPinned && (
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-yellow-400 to-orange-400"></div>
                    )}

                    {/* Header */}
                    <div className="flex justify-between items-start mb-3">
                        <h3 className="text-xl font-bold text-gray-800 flex-1 pr-2">
                            {note.title}
                        </h3>

                        {!note.isDeleted ? (
                            <div className="flex space-x-2">
                                <button
                                    onClick={() => onTogglePin(note.id)}
                                    className={`p-2 rounded-lg transition-all duration-200 ${
                                        note.isPinned 
                                            ? 'bg-yellow-100 text-yellow-600 hover:bg-yellow-200' 
                                            : 'text-gray-400 hover:bg-gray-100 hover:text-yellow-600'
                                    }`}
                                    title={note.isPinned ? 'Unpin' : 'Pin'}
                                >
                                    <i className="fas fa-thumbtack"></i>
                                </button>
                                <button
                                    onClick={() => onEdit(note)}
                                    className="p-2 text-gray-400 hover:bg-blue-100 hover:text-blue-600 rounded-lg transition-all duration-200"
                                    title="Edit"
                                >
                                    <i className="fas fa-edit"></i>
                                </button>
                                <button
                                    onClick={() => onToggleArchive(note.id)}
                                    className={`p-2 rounded-lg transition-all duration-200 ${
                                        note.isArchived 
                                            ? 'bg-green-100 text-green-600 hover:bg-green-200' 
                                            : 'text-gray-400 hover:bg-green-100 hover:text-green-600'
                                    }`}
                                    title={note.isArchived ? 'Unarchive' : 'Archive'}
                                >
                                    <i className="fas fa-archive"></i>
                                </button>
                                <button
                                    onClick={() => onDelete(note.id)}
                                    className="p-2 text-gray-400 hover:bg-red-100 hover:text-red-600 rounded-lg transition-all duration-200"
                                    title="Move to Trash"
                                >
                                    <i className="fas fa-trash"></i>
                                </button>
                            </div>
                        ) : (
                            <div className="flex space-x-2">
                                <button
                                    onClick={() => onRestore(note.id)}
                                    className="p-2 text-gray-400 hover:bg-green-100 hover:text-green-600 rounded-lg transition-all duration-200"
                                    title="Restore"
                                >
                                    <i className="fas fa-undo"></i>
                                </button>
                                <button
                                    onClick={() => onPermanentDelete(note.id)}
                                    className="p-2 text-gray-400 hover:bg-red-100 hover:text-red-600 rounded-lg transition-all duration-200"
                                    title="Delete Permanently"
                                >
                                    <i className="fas fa-trash-alt"></i>
                                </button>
                            </div>
                        )}
                    </div>

                    {/* Description */}
                    <p className="text-gray-600 mb-4 line-clamp-3">
                        {note.description || 'No description'}
                    </p>

                    {/* Tags */}
                    {note.tags && note.tags.length > 0 && (
                        <div className="flex flex-wrap gap-2 mb-4">
                            {note.tags.map((tag, index) => (
                                <span
                                    key={index}
                                    className="tag-badge px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-xs font-semibold"
                                >
                                    <i className="fas fa-tag mr-1"></i>
                                    {tag}
                                </span>
                            ))}
                        </div>
                    )}

                    {/* Footer */}
                    <div className="flex items-center justify-between text-xs text-gray-500 border-t pt-3">
                        <span>
                            <i className="fas fa-clock mr-1"></i>
                            {formatDate(note.updatedAt)}
                        </span>
                        {note.isPinned && (
                            <span className="px-2 py-1 bg-yellow-100 text-yellow-700 rounded-full font-semibold">
                                <i className="fas fa-thumbtack mr-1"></i>
                                Pinned
                            </span>
                        )}
                        {note.isArchived && (
                            <span className="px-2 py-1 bg-green-100 text-green-700 rounded-full font-semibold">
                                <i className="fas fa-archive mr-1"></i>
                                Archived
                            </span>
                        )}
                        {note.isDeleted && (
                            <span className="px-2 py-1 bg-red-100 text-red-700 rounded-full font-semibold">
                                <i className="fas fa-trash mr-1"></i>
                                In Trash
                            </span>
                        )}
                    </div>
                </div>
            );
        }

        // ==========================================
        // NOTE MODAL COMPONENT
        // ==========================================
        function NoteModal({ isEditing, formData, setFormData, tagInput, setTagInput, handleAddTag, removeTag, onSave, onClose }) {
            return (
                <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4 animate-fade-in">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                        {/* Modal Header */}
                        <div className="sticky top-0 bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-6 rounded-t-2xl">
                            <div className="flex justify-between items-center">
                                <h2 className="text-2xl font-bold">
                                    <i className={`fas ${isEditing ? 'fa-edit' : 'fa-plus-circle'} mr-2`}></i>
                                    {isEditing ? 'Edit Note' : 'Create New Note'}
                                </h2>
                                <button
                                    onClick={onClose}
                                    className="text-white hover:bg-white hover:bg-opacity-20 rounded-lg p-2 transition-all duration-200"
                                >
                                    <i className="fas fa-times text-xl"></i>
                                </button>
                            </div>
                        </div>

                        {/* Modal Body */}
                        <div className="p-6 space-y-5">
                            {/* Title Input */}
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">
                                    <i className="fas fa-heading mr-2 text-indigo-600"></i>
                                    Title *
                                </label>
                                <input
                                    type="text"
                                    value={formData.title}
                                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                    placeholder="Enter note title..."
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                    autoFocus
                                />
                            </div>

                            {/* Description Input */}
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">
                                    <i className="fas fa-align-left mr-2 text-indigo-600"></i>
                                    Description
                                </label>
                                <textarea
                                    value={formData.description}
                                    onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                                    placeholder="Enter note description..."
                                    rows="6"
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent resize-none"
                                ></textarea>
                            </div>

                            {/* Tags Input */}
                            <div>
                                <label className="block text-sm font-semibold text-gray-700 mb-2">
                                    <i className="fas fa-tags mr-2 text-indigo-600"></i>
                                    Tags
                                </label>
                                <input
                                    type="text"
                                    value={tagInput}
                                    onChange={(e) => setTagInput(e.target.value)}
                                    onKeyDown={handleAddTag}
                                    placeholder="Type a tag and press Enter..."
                                    className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                />

                                {/* Display Tags */}
                                {formData.tags.length > 0 && (
                                    <div className="flex flex-wrap gap-2 mt-3">
                                        {formData.tags.map((tag, index) => (
                                            <span
                                                key={index}
                                                className="inline-flex items-center px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-sm font-semibold"
                                            >
                                                <i className="fas fa-tag mr-1"></i>
                                                {tag}
                                                <button
                                                    onClick={() => removeTag(tag)}
                                                    className="ml-2 text-indigo-500 hover:text-indigo-700"
                                                >
                                                    <i className="fas fa-times"></i>
                                                </button>
                                            </span>
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Modal Footer */}
                        <div className="sticky bottom-0 bg-gray-50 p-6 rounded-b-2xl flex justify-end space-x-3 border-t">
                            <button
                                onClick={onClose}
                                className="px-6 py-3 border border-gray-300 text-gray-700 rounded-lg font-semibold hover:bg-gray-100 transition-all duration-200"
                            >
                                <i className="fas fa-times mr-2"></i>
                                Cancel
                            </button>
                            <button
                                onClick={onSave}
                                className="px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-lg font-semibold hover:shadow-lg transform hover:scale-105 transition-all duration-200"
                            >
                                <i className={`fas ${isEditing ? 'fa-save' : 'fa-plus'} mr-2`}></i>
                                {isEditing ? 'Save Changes' : 'Create Note'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // RENDER APP
        // ==========================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<NotesApp />);
    </script>
</body>
</html>
